name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  aur:
    name: Push to AUR
    needs: release
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: pacman -Syu --noconfirm && pacman -S --noconfirm git openssh

      - name: Configure SSH for AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          echo -e "Host aur.archlinux.org\n  IdentityFile ~/.ssh/aur\n  User aur" > ~/.ssh/config
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null

      - name: Update and push PKGBUILD
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git clone ssh://aur@aur.archlinux.org/naruto.git aur-repo || {
            # First push — init the repo
            mkdir aur-repo && cd aur-repo && git init
            git remote add origin ssh://aur@aur.archlinux.org/naruto.git
          }
          cd aur-repo

          # Copy and update PKGBUILD
          cp ../PKGBUILD .
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

          # Generate .SRCINFO
          makepkg --printsrcinfo > .SRCINFO

          # Commit and push
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to $VERSION"
          git push origin master
