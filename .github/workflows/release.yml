name: Publish AUR package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aur:
    name: Sync naruto-git to AUR
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install deps
        run: pacman -Syu --noconfirm && pacman -S --noconfirm git openssh pnpm

      - name: Restore git checkout
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          repo_url="https://github.com/${GITHUB_REPOSITORY}.git"

          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git remote set-url origin "$repo_url"
            exit 0
          fi

          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git init
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote add origin "$repo_url"
          git -c http.https://github.com/.extraheader="$auth_header" fetch origin "${GITHUB_REF}:refs/github/target-ref"

          case "$GITHUB_REF" in
            refs/heads/*)
              git checkout -B "${GITHUB_REF_NAME}" -f refs/github/target-ref
              ;;
            *)
              git checkout --detach -f refs/github/target-ref
              ;;
          esac

      - name: Validate publish config
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "AUR_SSH_KEY secret is not configured." >&2
            exit 1
          fi

          if [ ! -f aur/naruto-git/PKGBUILD ]; then
            echo "aur/naruto-git/PKGBUILD is missing." >&2
            exit 1
          fi

      - name: Configure SSH for AUR
        run: |
          ssh_dir="$HOME/.ssh"
          mkdir -p "$ssh_dir"
          echo "${{ secrets.AUR_SSH_KEY }}" > "$ssh_dir/aur"
          chmod 600 "$ssh_dir/aur"
          cat > "$ssh_dir/config" <<EOF
          Host aur.archlinux.org
            IdentityFile $ssh_dir/aur
            IdentitiesOnly yes
            User aur
          EOF
          touch "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/config" "$ssh_dir/known_hosts"
          ssh-keyscan -H aur.archlinux.org >> "$ssh_dir/known_hosts" 2>/dev/null

      - name: Refresh checked-in AUR metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pkg_dir="$GITHUB_WORKSPACE/aur/naruto-git"
          pkgver="r$(git rev-list --count HEAD -- . ':(exclude)aur/naruto-git/**').$(git log -1 --format=%h -- . ':(exclude)aur/naruto-git/**')"
          sed -i "s/^pkgver=.*/pkgver=$pkgver/" "$pkg_dir/PKGBUILD"
          printf 'PUBLISH_PKGVER=%s\n' "$pkgver" >> "$GITHUB_ENV"

          build_user=aurbuilder
          useradd -m "$build_user" 2>/dev/null || true
          chown -R "$build_user:$build_user" "$pkg_dir"
          runuser -u "$build_user" -- sh -lc "cd '$pkg_dir' && makepkg --printsrcinfo > .SRCINFO"
          chown -R root:root "$pkg_dir"

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add aur/naruto-git/PKGBUILD aur/naruto-git/.SRCINFO

          if git diff --cached --quiet; then
            echo "AUR metadata already up to date in GitHub."
            exit 0
          fi

          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git commit -m "Update AUR metadata to $pkgver"
          git -c http.https://github.com/.extraheader="$auth_header" push origin HEAD:main

      - name: Sync package contents
        run: |
          export GIT_SSH_COMMAND="ssh -F $HOME/.ssh/config -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes"
          pkg_dir="$GITHUB_WORKSPACE/aur/naruto-git"
          git clone ssh://aur@aur.archlinux.org/naruto-git.git aur-repo
          cd aur-repo
          git checkout -B master
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r "$pkg_dir"/. .
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "No AUR changes to publish."
            exit 0
          fi

          git commit -m "Update to ${PUBLISH_PKGVER:-${GITHUB_SHA::7}}"
          git push origin master
